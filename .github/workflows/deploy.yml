name: Deploy

on:

  workflow_dispatch:

      inputs:

        deploy:
          description: 'Deploy (true will deploy to pypi)'
          required: true
          default: 'false'

        deploytest:
          description: 'Deploy (true will deploy to test pypi)'
          required: true
          default: 'false'

jobs:

  build-windows-wheels:
    
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: [ 3.14 ]

    steps:

    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Show Python build paths
      shell: cmd
      run: |
        python -c "import sys, sysconfig; print(sys.executable); print(sys.version)"
        python -c "import sysconfig; print('include=', sysconfig.get_paths()['include'])"
        python -c "import sysconfig; print('platinclude=', sysconfig.get_paths().get('platinclude'))"
        python -c "import sysconfig; print('EXT_SUFFIX=', sysconfig.get_config_var('EXT_SUFFIX'))"
        for /f "delims=" %%I in ('python -c "import sysconfig; print(sysconfig.get_paths()[\"include\"]) "') do echo PL_PYTHON_INCLUDES=%%I>>"%GITHUB_ENV%"
        for /f "delims=" %%I in ('python -c "import sys, os; print(os.path.join(sys.base_prefix, 'libs'))"') do echo PL_PYTHON_LIBS=%%I>>"%GITHUB_ENV%"

    - name: Install Dependencies
      run: |
        Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.4.350.0/windows/vulkansdk-windows-X64-1.4.350.0.exe" -OutFile VulkanSDK.exe
        # ./VulkanSDK.exe --help
        ./VulkanSDK.exe --accept-licenses --default-answer --root D:/a/VulkanSDK --confirm-command install
        python -m pip install pl-build
        python -m pip install --upgrade pip build
        cd ..
        git clone https://github.com/PilotLightTech/pilotlight
        cd pilotlight-python

    - name: Build Binaries
      shell: cmd
      run: |
        set VULKAN_SDK=D:/a/VulkanSDK
        echo "%PL_PYTHON_INCLUDES%"
        cd %GITHUB_WORKSPACE%
        cd scripts
        python gen_build.py
        cd ../src
        call build.bat -c deploy
        if %ERRORLEVEL% NEQ 0 exit 1

    - name: Build Wheel
      shell: cmd
      run: |
        cd %GITHUB_WORKSPACE%
        python -m build --wheel --outdir dist

    - name: Bundle Runtime DLLs
      shell: pwsh
      run: |
        # vendor the dlls a fresh machine with only python won't have (i.e.
        # msvcp140.dll from the C++ code in shaderc/SPIRV-Cross). Python already
        # provides vcruntime140(_1).dll & the vulkan loader comes from the GPU
        # driver (and is delay loaded).
        python -m pip install delvewheel
        $wheel = (Get-ChildItem "$env:GITHUB_WORKSPACE/dist/*.whl").FullName
        python -m delvewheel show $wheel --exclude vulkan-1.dll
        if ($LASTEXITCODE -ne 0) { exit 1 }
        python -m delvewheel repair $wheel --wheel-dir "$env:GITHUB_WORKSPACE/wheelhouse" --exclude vulkan-1.dll
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Smoke Test Wheel
      shell: pwsh
      run: |
        python -m pip install (Get-ChildItem "$env:GITHUB_WORKSPACE/wheelhouse/*.whl").FullName
        cd $env:RUNNER_TEMP
        python "$env:GITHUB_WORKSPACE/scripts/smoke_test.py"
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Upload Windows ${{ matrix.python-version }} Wheel
      uses: actions/upload-artifact@v4
      with:
        name: windowsbuild${{ matrix.python-version }}
        path: ${{ github.workspace }}/wheelhouse/*.whl
        overwrite: true
        
  build-linux-wheels:

    runs-on: ubuntu-22.04
    env:
      CXX: g++-10
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Show Python build paths
      run: |
        python -c "import sys, sysconfig; print(sys.executable); print(sys.version)"
        python -c "import sysconfig; print('include=', sysconfig.get_paths()['include'])"
        python -c "import sysconfig; print('platinclude=', sysconfig.get_paths().get('platinclude'))"
        python -c "import sysconfig; print('EXT_SUFFIX=', sysconfig.get_config_var('EXT_SUFFIX'))"
        echo "PL_PYTHON_INCLUDES=$(python -c 'import sysconfig; print(sysconfig.get_paths()["include"])')" >> "$GITHUB_ENV"

    - name: Install Dependencies
      run: |
        # LunarG no longer publishes Ubuntu packages (last was 1.4.309), use the
        # tarball so all platforms build against the same SDK version
        curl -sSL https://sdk.lunarg.com/sdk/download/1.4.350.0/linux/vulkansdk-linux-x86_64-1.4.350.0.tar.xz -o vulkansdk.tar.xz
        mkdir -p $HOME/VulkanSDK
        tar -xJf vulkansdk.tar.xz -C $HOME/VulkanSDK
        echo "VULKAN_SDK=$HOME/VulkanSDK/1.4.350.0/x86_64" >> "$GITHUB_ENV"
        sudo apt update
        # the SDK tarball doesn't provide libvulkan.so to link against, use the
        # distro's loader (ABI stable, the SDK's headers are still used)
        sudo apt install libvulkan-dev
        sudo apt install libx11-dev
        sudo apt install libxkbcommon-x11-dev
        sudo apt install libx11-xcb-dev
        sudo apt install libxcb-xfixes0-dev
        sudo apt install libxcb-cursor-dev
        sudo apt install libxcb-cursor0
        sudo apt install libxcb-keysyms1-dev
        sudo apt install libxcursor-dev
        sudo apt install libxrandr-dev
        sudo apt install libxinerama-dev
        sudo apt install libgl-dev
        sudo apt install libxi-dev
        cd $GITHUB_WORKSPACE
        cd ..
        git clone https://github.com/PilotLightTech/pilotlight
        cd pilotlight-python
        python -m pip install pl-build

    - name: Build Binaries
      run: |
        cd $GITHUB_WORKSPACE
        echo "$PL_PYTHON_INCLUDES"
        cd scripts
        python3 gen_build.py
        cd ../src
        chmod +x build.sh
        ./build.sh -c deploy || exit 1

    - name: Build Wheel
      run: |
        cd $GITHUB_WORKSPACE
        python -m pip install --upgrade pip build auditwheel patchelf
        python -m build --wheel --outdir dist

        # tag with the real manylinux (glibc) level & check for unexpected
        # dependencies. The Vulkan loader & X11/xcb libraries come from the
        # user's system/driver, so they are excluded rather than bundled.
        auditwheel repair dist/*.whl --wheel-dir wheelhouse \
          --exclude 'libvulkan.so.1' \
          --exclude 'libxcb*' \
          --exclude 'libX11*' \
          --exclude 'libxkbcommon*'
        auditwheel show wheelhouse/*.whl

    - name: Smoke Test Wheel
      run: |
        python -m pip install $GITHUB_WORKSPACE/wheelhouse/*.whl
        cd $RUNNER_TEMP
        python $GITHUB_WORKSPACE/scripts/smoke_test.py

    - name: Upload Linux ${{ matrix.python-version }} Wheel
      uses: actions/upload-artifact@v4
      with:
        name: linuxbuild${{ matrix.python-version }}
        path: ${{ github.workspace }}/wheelhouse/*.whl
        overwrite: true

  build-apple-wheels:

    runs-on: macos-26
    env:
      CXX: g++-10
      # oldest macOS the wheel supports (must match the wheel's platform tag below)
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Show Python build paths
      run: |
        python -c "import sys, sysconfig; print(sys.executable); print(sys.version)"
        python -c "import sysconfig; print('include=', sysconfig.get_paths()['include'])"
        python -c "import sysconfig; print('platinclude=', sysconfig.get_paths().get('platinclude'))"
        python -c "import sysconfig; print('EXT_SUFFIX=', sysconfig.get_config_var('EXT_SUFFIX'))"
        echo "PL_PYTHON_INCLUDES=$(python -c 'import sysconfig; print(sysconfig.get_paths()["include"])')" >> "$GITHUB_ENV"
        echo "PL_PYTHON_LIBS=$(python -c 'import sysconfig; print(sysconfig.get_paths()["libs"])')" >> "$GITHUB_ENV"

    - name: Install Dependencies
      run: |
        curl https://sdk.lunarg.com/sdk/download/1.4.350.0/mac/vulkansdk-macos-1.4.350.0.zip -o vk.zip
        unzip vk.zip
        sudo ./vulkansdk-macOS-1.4.350.0.app/Contents/MacOS/vulkansdk-macOS-1.4.350.0 --root ~/VulkanSDK/1.4.350.0 --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core com.lunarg.vulkan.usr com.lunarg.vulkan.sdl2 com.lunarg.vulkan.glm com.lunarg.vulkan.volk com.lunarg.vulkan.vma com.lunarg.vulkan.ios
        cd $GITHUB_WORKSPACE
        cd ..
        git clone https://github.com/PilotLightTech/pilotlight
        cd pilotlight-python
        python -m pip install pl-build

    - name: Build Binaries
      run: |
        cd $GITHUB_WORKSPACE
        echo "$PL_PYTHON_INCLUDES"
        echo "$PL_PYTHON_LIBS"
        cd scripts
        python3 gen_build.py
        cd ../src
        chmod +x build.sh
        ./build.sh -c deploy || exit 1
        cd ../pilotlight
        ls
        
    - name: Build Wheel
      run: |
        cd $GITHUB_WORKSPACE
        python -m pip install --upgrade pip build
        python -m build --wheel --outdir dist -C--build-option=--plat-name=macosx_15_0_arm64

    - name: Smoke Test Wheel
      run: |
        python -m pip install $GITHUB_WORKSPACE/dist/*.whl
        cd $RUNNER_TEMP
        python $GITHUB_WORKSPACE/scripts/smoke_test.py

    - name: Upload Mac ${{ matrix.python-version }} Wheel
      uses: actions/upload-artifact@v4
      with:
        name: macbuild${{ matrix.python-version }}
        path: ${{ github.workspace }}/dist/*.whl
        overwrite: true

  deploy-packages:

    needs: [build-windows-wheels, build-linux-wheels, build-apple-wheels]
    runs-on: windows-2022

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel twine

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: PyPi Deployment
      shell: cmd
      if: ${{contains(github.event.inputs.deploy, 'true') && github.ref == 'refs/heads/master'}}
      run: |
        python -m twine upload windowsbuild*/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }} --skip-existing
        python -m twine upload macbuild*/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }} --skip-existing
        python -m twine upload linuxbuild*/* -u __token__ -p ${{ secrets.PYPI_API_TOKEN }} --skip-existing

    - name: Test PyPi Deployment
      shell: cmd
      if: "contains(github.event.inputs.deploytest, 'true')"
      run: |
        dir
        python -m twine upload --repository testpypi windowsbuild*/* -u __token__ -p ${{ secrets.TEST_PYPI_API_TOKEN }} --skip-existing
        python -m twine upload --repository testpypi macbuild*/* -u __token__ -p ${{ secrets.TEST_PYPI_API_TOKEN }} --skip-existing
        python -m twine upload --repository testpypi linuxbuild*/* -u __token__ -p ${{ secrets.TEST_PYPI_API_TOKEN }} --skip-existing
